services:
  nginx:
    image: nginx:alpine
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - 80:80
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:4-management
    restart: always
    ports:
      - 5672:5672
      - 15672:15672
    networks:
      - app-network
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
  api:
    build: "./api"
    restart: always
    ports:
      - 5555:5000
    volumes:
      - /app/node_modules
      - ./api:/app
    networks:
      - app-network
    depends_on:
      - rabbitmq

  mongo:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    ports:
      - 27017:27017
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/
      ME_CONFIG_BASICAUTH: false
    networks:
      - app-network
    depends_on:
      - mongo
  course-service:
    restart: always
    build: ./course-service
    ports:
      - 5556:5000
    environment:
      RABBITMQ_URL: "amqp://rabbitmq:5672"
      PORT: 5000
      MONGO_USERNAME: user
      MONGO_PASSWORD: password
      MONGO_URL: "mongodb://root:example@mongo:27017/lab_1?authSource=admin"
      JWT_SECRET: "secret"
      EXCHANGE_NAME: "app-exchange"
    depends_on:
      - rabbitmq
    networks:
      - app-network

  user-service:
    restart: always
    build: ./user-service
    ports:
      - 5557:5000
    environment:
      RABBITMQ_URL: "amqp://rabbitmq:5672"
      PORT: 5000
      MONGO_USERNAME: user
      MONGO_PASSWORD: password
      MONGO_URL: "mongodb://root:example@mongo:27017/lab_1?authSource=admin"
      JWT_SECRET: "secret"
      EXCHANGE_NAME: "app-exchange"
    depends_on:
      - rabbitmq
    networks:
      - app-network

  status-service:
    restart: always
    build: ./response-service
    ports:
      - 5558:5000
    environment:
      RABBITMQ_URL: "amqp://rabbitmq:5672"
      PORT: 5000
      MONGO_USERNAME: user
      MONGO_PASSWORD: password
      MONGO_URL: "mongodb://root:example@mongo:27017/lab_1?authSource=admin"
      EXCHANGE_NAME: "app-exchange"
    networks:
      - app-network
volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
